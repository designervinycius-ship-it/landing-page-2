<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>para Jojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blush: #f2e0d8;
    --rose: #c97b6e;
    --rose-dark: #8c4a3f;
    --cream: #faf6f0;
    --text: #3a2a25;
    --text-muted: #9a7b72;
  }

  html, body {
    min-height: 100%;
    background-color: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 2rem 1.5rem;
    position: relative;
    overflow-x: hidden;
  }

  .bg-petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .petal {
    position: absolute;
    width: 6px;
    height: 10px;
    border-radius: 60% 40% 60% 40% / 50% 50% 50% 50%;
    background: var(--blush);
    opacity: 0;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px;
    text-align: center;
    animation: rise 1.2s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cat-img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    margin-bottom: 2rem;
    animation: rise 1.2s 0.1s cubic-bezier(.22,1,.36,1) both;
    box-shadow: 0 4px 24px rgba(180,100,80,0.13);
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 1.6rem 0;
    animation: rise 1.2s 0.25s cubic-bezier(.22,1,.36,1) both;
  }

  .divider-line {
    flex: 1;
    max-width: 60px;
    height: 0.5px;
    background: var(--rose);
    opacity: 0.4;
  }

  .divider-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--rose);
    opacity: 0.6;
  }

  .message {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.25rem, 5vw, 1.5rem);
    line-height: 1.65;
    color: var(--text);
    letter-spacing: 0.01em;
    animation: rise 1.2s 0.35s cubic-bezier(.22,1,.36,1) both;
  }

  .message em {
    font-style: normal;
    color: var(--rose-dark);
  }

  .signature {
    margin-top: 1.4rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    animation: rise 1.2s 0.45s cubic-bezier(.22,1,.36,1) both;
  }

  .song-card {
    margin-top: 2.8rem;
    animation: rise 1.2s 0.6s cubic-bezier(.22,1,.36,1) both;
  }

  .song-link {
    display: flex;
    align-items: center;
    gap: 14px;
    background: white;
    border: 0.5px solid #e8d5cf;
    border-radius: 16px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 16px rgba(180,100,80,0.07);
  }

  .song-link:active {
    transform: scale(0.97);
  }

  .song-art {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: linear-gradient(135deg, #d4876e 0%, #c05a6b 50%, #8f3b6b 100%);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .song-art svg {
    width: 22px;
    height: 22px;
    fill: rgba(255,255,255,0.85);
  }

  .song-info {
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .song-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-artist {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .play-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--rose);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .play-icon svg {
    width: 12px;
    height: 12px;
    fill: white;
    margin-left: 2px;
  }

  .spotify-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-top: 10px;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.05em;
  }

  .spotify-badge svg {
    width: 12px;
    height: 12px;
    fill: #1DB954;
  }
</style>
</head>
